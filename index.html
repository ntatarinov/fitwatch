<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F3F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0C0C0F" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Тренировки с видео, питание с БЖУ, баллы, серия и тренеры в одном приложении.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FitWatch">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>FitWatch — тренировки с видео</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="logo" href="#/" aria-label="FitWatch, на главную">Fit<b>Watch</b></a>
    <a class="badge" href="#/profile" id="badge"></a>
    <a class="login-btn" href="#/account" id="loginbtn" hidden>Войти</a>
    <button class="mode-chip" data-modebtn type="button"></button>
    <a class="icon-btn help" href="#/guide" aria-label="Как пользоваться" title="Как пользоваться" data-ic="help" data-size="20"></a>
  </header>
  <main id="app"></main>
  <nav class="tabbar" id="tabbar">
    <a href="#/" data-t="home"><span data-ic="home"></span>Главная</a>
    <a href="#/programs" data-t="programs"><span data-ic="dumbbell"></span>Тренировки</a>
    <a href="#/food" data-t="food" data-mod="food"><span data-ic="food"></span>Питание</a>
    <a href="#/rating" data-t="rating" data-mod="rating"><span data-ic="trophy"></span>Рейтинг</a>
    <a href="#/coach" data-t="coach" id="coachtab" hidden><span data-ic="users"></span>Клиенты</a>
    <a href="#/profile" data-t="profile"><span data-ic="user"></span>Профиль</a>
  </nav>
  <script src="data.js"></script>
  <script src="catalog.js"></script>
  <script src="machines.js"></script>
  <script src="nutrition.js"></script>
  <script src="planner.js"></script>
  <script src="body.js"></script>
  <script src="body3d.js"></script>
  <script src="ideas.js"></script>
  <script src="achievements.js"></script>
  <script src="icons.js"></script>
  <script src="fx.js"></script>
  <script src="engine.js"></script>
  <script src="tree.js"></script>
  <script src="photo.js"></script>
  <script src="charts.js"></script>
  <script src="guide.js"></script>
  <script src="pwa.js"></script>
  <script src="account.js"></script>
  <script src="pages.js"></script>
  <script src="pages-account.js"></script>
  <script src="pages-trainers.js"></script>
  <script src="pages-coach.js"></script>
  <script src="pages-guide.js"></script>
  <script src="app.js"></script>
</body>
</html>
